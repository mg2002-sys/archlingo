  <script>
    // Automatically purge any stale service workers or caches
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {

/* Tactile Duolingo 3D Lipped Cards & Buttons */
.duo-card {

  font-weight: 800;
  transition: all 0.12s ease;
  cursor: pointer;
}
.duo-btn-green:hover {
  background-color: #61e002;
}
.duo-btn-green:active {
  transform: translateY(4px);
  border-bottom-width: 0px;
}

.duo-btn-blue {
  background-color: #1cb0f6;
  color: #ffffff;
  border: 2px solid #1cb0f6;

.duo-btn-outline {

}

  transform: translateY(4px);

}

/* Winding Stepping Stone Nodes */
.stone-node {
  width: 72px;
  height: 64px;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
  cursor: pointer;
  user-select: none;
}
.stone-node:hover {
  transform: translateY(-4px) scale(1.06);
}
.stone-node:active {
  transform: translateY(4px);
}

.stone-complete {
  background-color: #ffc800;
  border: 3px solid #ffe066;
  border-bottom: 7px solid #e5b400;
  color: #78350f;
}
.stone-current {
  background-color: #58cc02;
  border: 3px solid #89e219;
  border-bottom: 7px solid #58a700;
  color: #ffffff;
  animation: pulse-ring 2.2s infinite;
}
.stone-locked {
  background-color: #e2e8f0;
  border: 3px solid #f1f5f9;
  border-bottom: 7px solid #cbd5e1;
  color: #94a3b8;
}
html.dark .stone-locked {
  background-color: #1e293b;
  border-color: #334155;
  border-bottom-color: #0f172a;
  color: #64748b;
}

@keyframes pulse-ring {
  0% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.55); }
  70% { box-shadow: 0 0 0 16px rgba(88, 204, 2, 0); }
  100% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0); }
}

/* Archie Owl Hopping Animation */
@keyframes archie-hop {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-28px) scale(1.15) rotate(-6deg); }
  75% { transform: translateY(4px) scale(0.95) rotate(4deg); }
  100% { transform: translateY(0) scale(1); }
}
.animate-archie-hop {
  animation: archie-hop 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Streak Flame Pulse */
@keyframes flame-pulse {
  0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 8px rgba(255, 150, 0, 0.5)); }
  50% { transform: scale(1.14) rotate(3deg); filter: drop-shadow(0 0 14px rgba(255, 150, 0, 0.85)); }
}
.animate-flame {
  animation: flame-pulse 2s infinite ease-in-out;
}

/* Heart Loss Shake Animation */
@keyframes heart-shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px) rotate(-4deg); }
  40%, 80% { transform: translateX(6px) rotate(4deg); }
}
.animate-shake {
  animation: heart-shake 0.45s ease-in-out;
}

/* Speech Bubble Tail */
.speech-bubble {
  position: relative;
}
.speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 10px 10px 0;
  border-style: solid;
  border-color: var(--bg-card) transparent;
  display: block;
  width: 0;
}

Hash modulo partitioning maps arbitrary data keys to one of $N$ discrete storage nodes by calculating the integer remainder of a 64-bit hash of the key:

### What Consistent Hashing Is
Consistent Hashing is a partitioning scheme where both storage nodes and data keys are mapped to points on a continuous circular mathematical identifier space known as the **Hash Ring** (typically $[0, 2^{32}-1]$ or $[0, 2^{64}-1]$).

### Why Engineers Invented It (David Karger et al., 1997)
Consistent hashing was invented to solve the hash modulo scaling catastrophe. When an $N$-node cluster changes by adding or removing a node, consistent hashing guarantees that on average only:
$$\\text{Keys Relocated} = \\frac{K}{N}$$
keys must be moved (where $K$ is the total number of keys and $N$ is the number of servers), leaving all remaining keys completely unaffected.

### How Ketama Ring Routing Operates Step-by-Step
1. **Ring Construction**: The 32-bit unsigned integer range from $0$ to $2^{32}-1$ is wrapped into a circular ring where $2^{32}-1$ connects back to $0$.
2. **Node Placement**: Each physical server (e.g., \`redis-node-01:6379\`) is hashed using MD5 or MurmurHash3 into a 32-bit unsigned integer token, placing it at a fixed coordinate on the ring.
3. **Data Key Routing**: When writing or reading key $K$, the client hashes the key:
$$\\text{Token} = \\text{Hash}(K)$$
4. **Clockwise Traversal**: The client walks clockwise along the ring starting from $\\text{Token}$ until it encounters the first server token. That server is the owner of key $K$.
5. **Node Addition**: When a new node $N_{new}$ is placed on the ring between node $A$ and node $B$, it only claims keys located between $A$ and $N_{new}$. Node $B$ relinquishes those keys; all other nodes on the ring remain 100% untouched.

Nodes on the ring are maintained as a sorted array of 32-bit integers:

When routing key $K$ with hash $h = \\text{Hash}(K)$:

$$\\text{Time Complexity} = O(\\log M)$$
where $M$ is the number of node tokens on the ring.
2. If $h > t_{M-1}$, the search wraps around to $t_0$ (the circular ring invariant).

\`\`\`go
package main

import (
	"crypto/md5"
	"fmt"
	"sort"
	"strconv"
)

type HashRing struct {
	ring    []uint32          // Sorted list of token hashes
	nodeMap map[uint32]string // Token hash -> Node address
}

func NewHashRing() *HashRing {
	return &HashRing{
		ring:    make([]uint32, 0),
		nodeMap: make(map[uint32]string),
	}
}

func hashKey(key string) uint32 {
	h := md5.Sum([]byte(key))
	// Take first 4 bytes as 32-bit unsigned integer (big-endian)
	return uint32(h[3]) | uint32(h[2])<<8 | uint32(h[1])<<16 | uint32(h[0])<<24
}

func (hr *HashRing) AddNode(node string) {
	token := hashKey(node)
	hr.ring = append(hr.ring, token)
	hr.nodeMap[token] = node
	sort.Slice(hr.ring, func(i, j int) bool { return hr.ring[i] < hr.ring[j] })
}

func (hr *HashRing) GetNode(key string) string {
	if len(hr.ring) == 0 {
		return ""
	}
	token := hashKey(key)
	// Binary search for first node token >= key token
	idx := sort.Search(len(hr.ring), func(i int) bool {
		return hr.ring[i] >= token
	})
	// Circular wrap-around
	if idx == len(hr.ring) {
		idx = 0
	}
	return hr.nodeMap[hr.ring[idx]]
}

### What Virtual Nodes (Vnodes) Are
A Virtual Node (Vnode) is an abstraction where a single physical machine is assigned multiple pseudo-random coordinates across the consistent hashing ring, rather than a single point. If a cluster uses $V=256$ vnodes per server, a cluster of 10 physical machines maintains $2,560$ discrete tokens on the ring.

In a naive consistent hash ring with 1 token per physical server, statistical variance in the spacing between tokens is catastrophic. According to probability theory, the standard deviation of shard sizes is as high as the mean itself. Vnodes solve three critical engineering problems:

Range-based partitioning divides data into contiguous, non-overlapping sorted intervals based on the natural ordering of the primary key. For example:

A **Shard Key** (or Partition Key) is one or more immutable attributes present in every database record that the distributed database engine uses to determine which physical shard owns the record.

Unlike adding an index or tuning a buffer pool, changing a shard key on a multi-terabyte production database requires a complete, high-risk offline or dual-write data migration. An incorrect shard key creates permanent system pathologies:

A **Celebrity Key** occurs when a single key in a distributed database experiences read or write traffic orders of magnitude higher than the cluster average. For example:

### What a Scatter-Gather Query Is
A **Scatter-Gather** (or Broadcast) query is an operation where a query coordinator sends parallel sub-queries to all $N$ shards in a distributed cluster ("scatter"), waits for all shards to respond, merges and sorts the intermediate results ("gather"), and returns the final response to the client.

### The Tail Latency Amplification Law
If a single shard has a $99\\text{th}$ percentile ($P99$) latency of $10\\text{ ms}$ with an independent probability $p = 0.01$ of experiencing a tail latency spike:
The probability that a scatter-gather query across $N$ shards completes *without* hitting a single $P99$ spike is:
$$P(\\text{all fast}) = (1 - p)^N = (0.99)^N$$
For a cluster with $N=100$ shards:
$$P(\\text{all fast}) = (0.99)^{100} \\approx 0.366 \\quad (36.6\\%)$$
Therefore, **$63.4\\%$ of all scatter-gather requests experience the $P99$ latency spike**, transforming a rare 1% anomaly into the routine user experience!

### The Catastrophe of Deep Offset Pagination (\`LIMIT 50 OFFSET 100000\`)
When executing cross-partition pagination:
\`\`\`sql
SELECT * FROM orders WHERE status = 'SHIPPED' ORDER BY created_at DESC LIMIT 50 OFFSET 100000;
\`\`\`
1. The coordinator cannot know which shard has the globally newest records.
2. It must instruct **every single shard** to return its top $100,050$ records.
3. In a 20-shard cluster, the coordinator receives $20 \\times 100,050 = 2,001,000$ records across the network, deserializes them in memory, performs a 2-million-element in-memory sort, discards $2,000,950$ records, and returns $50$.
4. Result: Gigabytes of cross-rack network transfer, CPU starvation, and Out-Of-Memory (OOM) killer crashes.

\`\`\`go
package main

import (
	"container/heap"
	"context"
)

type Record struct {
	ID        int64
	CreatedAt int64
	Data      string
}

// Priority Queue to k-way merge sort sorted streams from N shards in O(K log N)
type RecordHeap []*RecordStream

type RecordStream struct {
	Records []*Record
	Index   int
}

func MergeShardStreams(streams []*RecordStream, limit int) []*Record {
	h := &RecordHeap{}
	heap.Init(h)
	for _, s := range streams {
		if len(s.Records) > 0 {
			heap.Push(h, s)
		}
	}

	result := make([]*Record, 0, limit)
	for h.Len() > 0 && len(result) < limit {
		fastest := heap.Pop(h).(*RecordStream)
		result = append(result, fastest.Records[fastest.Index])
		fastest.Index++
		if fastest.Index < len(fastest.Records) {
			heap.Push(h, fastest)
		}
	}
	return result
}

### What Online Resharding Is
Online Resharding is the operational process of changing the number of database shards (e.g., doubling from 16 to 32 shards) or changing the partition key on a live production database handling continuous read and write traffic without incurring service downtime, data loss, or inconsistent reads.

### Why Simple Offline Migration is Prohibited
At modern scale, migrating a $20\\text{ TB}$ transactional database requires hours or days. Taking an e-commerce platform or financial payment processor offline for a 12-hour maintenance window violates SLA commitments and results in millions of dollars in lost revenue.

### The 4-Phase Zero-Downtime Migration Pattern
Production migrations follow a rigorous 4-phase state machine:
1. **Phase 1: Dual Writing (New Writes to Both Clusters)**:
   - Application writes to the Old Shard Cluster (System of Record).
   - Asynchronously or synchronously writes to the New Shard Cluster wrapped in a try-catch block (failures on the new cluster do not fail the user request).
2. **Phase 2: Historical Backfill (Catch-up)**:
   - A background ETL process copies historical records from Old to New.
   - Idempotent upserts guarantee that if a record was already written by Phase 1, the newer version is preserved.
3. **Phase 3: Continuous Verification & Reconciliation**:
   - A verification daemon tails Change Data Capture (CDC) streams and compares checksums between Old and New clusters.
   - Dual-writing continues until data divergence drops to 0.000%.
4. **Phase 4: Flip System of Record (Cutover)**:
   - Switch application reads to the New Shard Cluster.
   - Switch primary writes to the New Shard Cluster.
   - Stop writes to the Old Shard Cluster and deprecate after a soak period.

### What Two-Phase Commit (2PC) Is
Two-Phase Commit (2PC) is a distributed consensus algorithm designed to achieve **atomicity across multiple independent database shards** participating in a single transaction: either all shards commit their local changes, or all shards abort and rollback.

### The Two Phases Step-by-Step
A designated **Transaction Coordinator** coordinates $M$ participant shards:
1. **Phase 1: Prepare Phase**:
   - Coordinator sends \`PREPARE\` message over the network to all participant shards.
   - Each shard opens a local transaction, acquires exclusive locks on modified rows, writes changes to its local Write-Ahead Log (WAL), and responds \`VOTE_COMMIT\` (if ready) or \`VOTE_ABORT\` (if lock conflicts or resource exhaustion occurred).
2. **Phase 2: Commit Phase**:
   - **If ALL participants voted \`VOTE_COMMIT\`**: The coordinator writes a \`COMMIT\` record to its durable log and sends \`GLOBAL_COMMIT\` to all shards. Shards commit their local transactions, release locks, and reply \`ACK\`.
   - **If ANY participant voted \`VOTE_ABORT\` or timed out**: The coordinator writes an \`ABORT\` record to its log and sends \`GLOBAL_ABORT\` to all shards. Shards rollback local changes and release locks.

### The Fatal Flaw of 2PC: Blocking Under Coordinator Crash
2PC is a **blocking protocol**. If the coordinator sends \`PREPARE\` and all shards vote \`VOTE_COMMIT\`, but the coordinator crashes *before* sending \`GLOBAL_COMMIT\` or \`GLOBAL_ABORT\`:
1. The participant shards are left in an **in-doubt state**.
2. Because they promised to commit, they **cannot unilaterally abort**.
3. Because they have not received confirmation, they **cannot unilaterally commit**.
4. Participant shards must hold exclusive row locks indefinitely.
5. All subsequent transactions attempting to access those locked rows are blocked, causing connection pool exhaustion and cascading system deadlock across the entire cluster!
`

package main

import (
	"context"
	"errors"
	"sync"

type Participant interface {
	Prepare(ctx context.Context, txID string) (bool, error)
	Commit(ctx context.Context, txID string) error
	Rollback(ctx context.Context, txID string) error
}

func Execute2PC(ctx context.Context, txID string, participants []Participant) error {
	// Phase 1: Prepare Phase
	var wg sync.WaitGroup
	votes := make([]bool, len(participants))
	errs := make([]error, len(participants))

	for i, p := range participants {
		wg.Add(1)
		go func(idx int, part Participant) {
			defer wg.Done()
			votes[idx], errs[idx] = part.Prepare(ctx, txID)
		}(i, p)
	}
	wg.Wait()

	// Evaluate votes
	allCommit := true
	for i := range participants {
		if errs[i] != nil || !votes[i] {
			allCommit = false
			break
		}
	}

	// Phase 2: Commit or Abort Phase
	if allCommit {
		for _, p := range participants {
			_ = p.Commit(ctx, txID) // Durable commit
		}
		return nil
	}

	// Abort if any participant failed
	for _, p := range participants {
		_ = p.Rollback(ctx, txID)
	}
	return errors.New("transaction aborted: prepare phase failed")
}

### What the Saga Pattern Is
A **Saga** is a sequence of local transactions spanning multiple distributed services or database shards. Each local transaction updates data within a single service and publishes an event or message. If any local step fails, the Saga executes a series of **Compensating Transactions** that explicitly undo the preceding changes in reverse order.

### Why Engineers Invented It (Hector Garcia-Molina & Kenneth Salem, 1987)
Engineers invented Sagas because distributed 2PC cannot scale across microservices or geographic regions:
1. Long-lived transactions hold 2PC database locks for seconds, exhausting connection pools.
2. Independent microservices with distinct databases cannot share low-level XA/2PC database drivers.
3. Sagas trade strict ACID **Isolation** for **Availability and Scalability**, achieving Eventual Consistency without global locks.

### The Two Saga Coordination Topologies
1. **Choreography (Event-Driven)**:
   - Services listen to domain events and execute local transactions autonomously.
   - Example: Payment Service emits \`PaymentCaptured\`; Inventory Service listens and reserves stock.
   - Pro: Simple, no central bottleneck.
   - Con: Cyclic dependencies, difficult to trace and debug at scale.
2. **Orchestration (Central Coordinator)**:
   - A dedicated **Saga Orchestrator** state machine explicitly sends command messages to participant services (e.g. \`ProcessPayment\`, \`ReserveInventory\`) and listens for replies.
   - Pro: Clear centralized workflow, explicit timeouts, easy observability.
   - Con: Orchestrator service represents an extra infrastructural component.

type Step struct {

	Execute    func(ctx context.Context) error
	Compensate func(ctx context.Context) error

	executedSteps := make([]Step, 0)

			fmt.Printf("Step %s failed: %v. Initiating compensation...\\n", step.Name, err)

	// Execute compensations in strict reverse order

In distributed systems theory (Fischer, Lynch, Paterson, 1985), an **Asynchronous Network** is an execution model where:
1. Message transmission delay is **unbounded**: a message will eventually arrive, but there is no guaranteed upper bound on how long it takes.
2. Processor execution speed is **arbitrary**: a thread may be paused for seconds or minutes by OS context switching, JVM Stop-The-World garbage collection, or hypervisor CPU throttling.

When Server A sends an RPC request to Server B and experiences a network timeout after $500\\text{ ms}$, Server A faces three indistinguishable physical realities:

2. Server B received the request and executed the operation, but crashed before replying.
3. Server B executed the operation and transmitted the response, but the response packet was delayed in a congested switch buffer or dropped.

// Executing an operation over an unreliable network requires an Idempotency Key
func ExecutePaymentWithIdempotency(ctx context.Context, db *sql.DB, idempotencyKey string, amountCents int64, accountID string) error {
	tx, err := db.BeginTx(ctx, &sql.TxOptions{Isolation: sql.LevelSerializable})

	err = tx.QueryRowContext(ctx, "SELECT status FROM idempotency_keys WHERE key = $1 FOR UPDATE", idempotencyKey).Scan(&status)

		}

	} else if !errors.Is(err, sql.ErrNoRows) {
		return err
	}

	_, err = tx.ExecContext(ctx, "INSERT INTO idempotency_keys (key, status) VALUES ($1, 'PENDING')", idempotencyKey)

Modern computer motherboards track physical time using quartz crystal oscillators. Due to temperature fluctuations, crystal imperfections, and semiconductor aging, quartz crystals oscillate at slightly variable frequencies.

### Formal Definitions of CAP (Eric Brewer, 2000; Seth Gilbert & Nancy Lynch, 2002)
The CAP theorem is frequently misunderstood. Its formal definitions are exact:
1. **Consistency (Linearizability / Strong Consistency)**:
   Every read operation must return the value of the most recent write, or throw an error. The distributed system behaves as if there is only a single atomic, centralized copy of the data.
2. **Availability**:
   **Every non-failing node** must return a successful (non-error) response to every request it receives. Returning an HTTP 500 error, timing out, or rejecting a write violates Availability.
3. **Partition Tolerance**:
   The system continues to operate despite an arbitrary number of dropped or delayed messages between network nodes.

### The Lynch-Gilbert Mathematical Proof
1. Suppose a distributed system consists of two nodes, $G_1$ and $G_2$.
2. A physical network partition occurs, completely severing all communication between $G_1$ and $G_2$.
3. A client connects to $G_1$ and writes $v_1$ ($G_1$ updates its local storage).
4. Simultaneously, a client connects to $G_2$ and requests a read.
5. Because the network is partitioned, $G_1$ cannot send the update $v_1$ to $G_2$.
6. Node $G_2$ has only two possible courses of action:
   - **Option A (Availability)**: $G_2$ responds immediately with its local stale value $v_0$. This violates **Consistency** (Linearizability).
   - **Option B (Consistency)**: $G_2$ blocks waiting for communication with $G_1$, or returns an error. This violates **Availability**.
7. **Conclusion**: When a network partition ($P$) occurs, a distributed system must choose between **Consistency ($CP$)** or **Availability ($AP$)**. You cannot "choose CA" because network partitions are physical phenomena that cannot be opted out of!
`

### What the PACELC Theorem Is (Daniel Abadi, 2012)
The CAP theorem only describes system behavior during rare network **Partitions**. However, in 99.99% of normal operations, networks are healthy. The **PACELC Theorem** extends CAP to describe the fundamental engineering trade-offs that govern distributed systems at all times:
- **If there is a Partition ($P$)**:
  How does the system choose between **Availability ($A$)** and **Consistency ($C$)**?
- **Else ($E$) (Normal Network Operation)**:
  How does the system choose between **Latency ($L$)** and **Consistency ($C$)**?

### The Normal Operation Dilemma: Latency vs Consistency
Even when network cables are completely intact and zero packets are lost, maintaining linearizable consistency across replicated nodes incurs a physical latency penalty:
1. To guarantee that a read operation observes the latest write, the write must synchronously replicate to a majority of replicas and wait for cross-network ACKs before returning to the client.
2. In a multi-region deployment (e.g. US East to Europe West, $\\approx 70\\text{ ms}$ round-trip latency), strong consistency ($C$) forces every write to incur at least $70\\text{ ms}$ of network latency.
3. If an engineer chooses low Latency ($L$), writes commit locally in $<1\\text{ ms}$ and replicate asynchronously in the background, but reads hitting other replicas will observe stale data.

### What a Quorum Is
In a leaderless or multi-leader distributed storage system (such as Apache Cassandra, Amazon Dynamo, or Riak) with $N$ total replicas for every data item:
- $N$ = **Replication Factor** (total number of nodes holding a copy of the data).
- $W$ = **Write Quorum** (number of replicas that must acknowledge a write before it is reported as successful).
- $R$ = **Read Quorum** (number of replicas that must respond to a read query before returning the result to the client).

### The Strict Quorum Overlap Invariant (The Pigeonhole Principle)
To guarantee that every read operation observes the most up-to-date write value, the read and write quorums must satisfy the **Quorum Invariant**:
$$W + R > N$$
If this inequality holds:
1. By the Pigeonhole Principle, the set of nodes written to ($W$) and the set of nodes read from ($R$) MUST contain at least **one overlapping node**:
$$\\text{Overlap} = (W + R) - N \\ge 1$$
2. That overlapping node holds the latest write timestamp or version number.
3. The client receives responses from all $R$ nodes, compares their version numbers, selects the record with the highest version, and is guaranteed to observe the latest written data!

import (

	"errors"
	"sync"

type ReplicaResponse struct {
	Value     string
	Version   int64
	ReplicaID int
}

func ReadQuorumWithRepair(ctx context.Context, replicas []StorageNode, key string, R int) (string, error) {
	respChan := make(chan ReplicaResponse, len(replicas))
	var wg sync.WaitGroup

	for i, node := range replicas {
		wg.Add(1)
		go func(id int, n StorageNode) {
			defer wg.Done()
			val, ver, err := n.Get(ctx, key)
			if err == nil {
				respChan <- ReplicaResponse{Value: val, Version: ver, ReplicaID: id}
			}
		}(i, node)
	}

	// Wait for R responses
	responses := make([]ReplicaResponse, 0, R)
	for len(responses) < R {
		select {
		case resp := <-respChan:
			responses = append(responses, resp)
		case <-ctx.Done():
			return "", errors.New("read quorum timeout: insufficient replicas responded")
		}
	}

	// Find the newest version among responding nodes
	var newest ReplicaResponse
	for _, r := range responses {
		if r.Version > newest.Version {
			newest = r
		}
	}

	// Asynchronous Read Repair: update any replica that returned a stale version
	go func() {
		for _, r := range responses {
			if r.Version < newest.Version {
				_ = replicas[r.ReplicaID].Put(context.Background(), key, newest.Value, newest.Version)
			}
		}
	}()

	return newest.Value, nil

### What Split-Brain Is
**Split-Brain** is a catastrophic distributed systems condition where a single cluster is partitioned into two or more isolated segments, and each segment independently believes it is the sole active master/primary, accepting conflicting client writes simultaneously.

### The Mechanism of Split-Brain
1. Primary Node $M_1$ experiences a $10\\text{-second}$ network hiccup or GC freeze.
2. The remaining cluster nodes ($M_2, M_3$) observe missing heartbeats, conclude $M_1$ is dead, and promote $M_2$ to be the new Primary.
3. $M_1$ recovers from its GC freeze. Because it was frozen, it does not know it was demoted.
4. $M_1$ and $M_2$ both believe they are the legitimate primary.
5. Network partitions route some clients to $M_1$ and others to $M_2$. Both accept conflicting writes, resulting in permanent, unrecoverable data corruption.

### The Solution: Fencing Tokens & Generation Clocks (Martin Kleppmann, DDIA)
Distributed locking mechanisms (like Redis Redlock or ZooKeeper ephemeral nodes) cannot prevent split-brain on their own because a node can be paused *after* acquiring a lock.
To guarantee safety, the storage engine must enforce **Fencing Tokens**:
1. Every time a lock or leadership is granted, the consensus coordinator issues a **monotonically increasing fencing token** (Epoch / Term number, e.g. $T = 34, 35, 36$).
2. The client must include the fencing token in every write operation to the storage tier.
3. The storage engine tracks the highest fencing token it has ever observed ($T_{max}$).
4. If a write arrives with token $T < T_{max}$, the storage engine **strictly rejects the write**.

Published in 1985 by **Fischer, Lynch, and Paterson** (winning the Dijkstra Prize), the FLP Impossibility Result is one of the most celebrated theorems in computer science.

1. **Safety (Agreement & Validity)**:

3. **Fault Tolerance**:

In an asynchronous network, message delivery delays are unbounded. A node that is not responding could be dead, or it could simply be experiencing a delayed network switch or GC pause.

Raft guarantees the fundamental **Log Matching Invariant**:
- If two entries in different logs have the same index and term, they store the same command.

type TrueTimeInterval struct {
	Earliest time.Time
	Latest   time.Time

// Simulating Google Spanner's TrueTime API
func TTNow(epsilon time.Duration) TrueTimeInterval {
	now := time.Now()
	return TrueTimeInterval{
		Earliest: now.Add(-epsilon),
		Latest:   now.Add(epsilon),
	}
}

func CommitTransactionWithTrueTime(ctx context.Context, epsilon time.Duration) time.Time {
	// 1. Assign commit timestamp equal to latest possible physical time
	tt := TTNow(epsilon)
	commitTimestamp := tt.Latest

	// 2. Commit Wait Rule: Deliberately sleep until Earliest > commitTimestamp
	// Guarantees no future transaction can ever receive a timestamp <= commitTimestamp
	for {
		currentTT := TTNow(epsilon)
		if currentTT.Earliest.After(commitTimestamp) {
			break
		}
		// Sleep remaining uncertainty duration
		sleepDur := commitTimestamp.Sub(currentTT.Earliest)
		if sleepDur > 0 {
			time.Sleep(sleepDur)
		}
	}

	return commitTimestamp
}

In Apache Kafka:
1. **Topic**: A logical stream category to which records are published (e.g., \`orders.v1\`).

A **Consumer Group** is a set of cooperating worker processes that collaboratively consume all partitions of a topic:
- **The Cardinal Rule**: **Each partition is assigned to exactly ONE consumer instance within a consumer group at any given time**.

- If the group scales to $C=15$ instances: **5 instances sit completely idle** doing zero work, because a partition cannot be shared within the same consumer group!
- **Partition Count ($P$) is the Absolute Hard Upper Bound on Consumer Parallelism**.

### Why Traditional File Transmission is Inefficient
In a traditional web or storage server, sending a file from disk to a network socket requires **4 context switches** and **4 data copies**:
1. \`read()\` system call: OS copies data from **Disk $\\to$ OS Page Cache** via DMA Copy (1).
2. CPU copies data from **OS Page Cache $\\to$ JVM/User-Space Buffer** (2).
3. \`write()\` system call: CPU copies data from **User-Space Buffer $\\to$ Socket Buffer** in kernel space (3).
4. OS copies data from **Socket Buffer $\\to$ NIC Buffer** via DMA Copy (4).

Kafka achieves multi-gigabit throughput by delegating data transfer directly to the Linux kernel via the \`sendfile()\` system call:

### The Three Message Delivery Semantics
In any distributed asynchronous messaging pipeline:
1. **At-Most-Once**:
   - Messages may be lost, but are **never duplicated**.
   - Mechanism: Consumer commits offset *before* processing the message. If the consumer crashes during processing, the message is never retried.
2. **At-Least-Once (The Production Standard)**:
   - Messages are **never lost**, but **may be duplicated**.
   - Mechanism: Consumer processes the message and writes to its database, *then* commits its offset. If the consumer crashes after writing to the database but *before* committing the offset, the replacement consumer re-reads and re-processes the exact same message.
3. **Exactly-Once**:
   - Every message affects the final state machine exactly once. (Requires end-to-end transactional coordination).

### Why Distributed Systems Default to At-Least-Once
Because networks are unreliable asynchronous channels (Stage 61), network packet drops and transient crashes are unavoidable. To guarantee zero data loss, producers and consumers must retry unacknowledged messages, making **duplicate message delivery an inevitable physical certainty**.

### Designing Strictly Idempotent Consumers
An operation $f(x)$ is **idempotent** if applying it multiple times produces the identical state as applying it once:
$$f(f(x)) = f(x)$$
Three production patterns to achieve consumer idempotency:
1. **Unique Deduplication Index**: Storing the message ID in a relational table with a \`UNIQUE\` constraint; duplicates fail cleanly with \`ON CONFLICT DO NOTHING\`.
2. **Deterministic Natural Keys**: Inserting records with natural business keys (\`order_id = "ord_9981"\`) rather than auto-incrementing surrogate IDs.
3. **State Transition Guards**: In SQL:
\`\`\`sql
UPDATE orders SET status = 'PAID' WHERE id = 'ord_101' AND status = 'PENDING';
\`\`\`
If executed 5 times, it mutates the row on run 1, and mutates 0 rows on runs 2 through 5.

Introduced in Kafka 0.11 (2017), Kafka's **Exactly-Once Semantics (EOS)** guarantees that in a stream processing pipeline:

### What Backpressure Is
**Backpressure** is a flow-control feedback mechanism in asynchronous distributed pipelines where a downstream consumer signals an upstream producer to slow down or halt message transmission because the consumer's internal buffers are approaching saturation.

### The Catastrophe of Unbounded Buffering
When an upstream producer emits data faster than a downstream consumer can process ($V_{producer} > V_{consumer}$), the system must store the differential:
$$\\text{Buffer Growth Rate} = V_{producer} - V_{consumer}$$
1. If the consumer uses an **unbounded in-memory queue** (e.g. \`LinkedBlockingQueue\` in Java or an unbuffered Go channel with infinite goroutines):
2. RAM consumption grows linearly until the operating system Out-Of-Memory (OOM) killer forcefully terminates the process (\`SIGKILL\`).
3. When the service restarts, it attempts to read the backlog, immediately runs out of memory, and enters a **perpetual crash loop**.

### The Three Fundamental Backpressure Strategies
1. **Push with Flow-Control Signaling (Reactive Streams)**:
   - Consumer grants **Credit / Demand Tokens** to producer: "I have capacity for 5 messages".
   - Producer is physically blocked from sending message 6 until consumer explicitly grants more credit.
2. **Pull-Based Architecture**:
   - Consumer dictates consumption rate by issuing explicit batch fetch requests (e.g. Kafka \`poll()\`). The producer cannot overwhelm the consumer because the broker holds the data.
3. **Shedding / Dropping (Load Shedding)**:
   - When buffers exceed $80\\%$, drop new incoming messages (Drop Tail) or drop the oldest unserviced messages (Drop Head) with HTTP 429 / 503 errors.

### What a Poison-Pill Message Is
A **Poison-Pill** is a message published to a queue or event stream that **cannot be processed successfully by the consumer**, regardless of how many times it is retried. Causes include:
- Malformed JSON / serialization syntax errors.
- Schema violations (missing mandatory fields).
- Business logic invariant violations (e.g. negative balance).
- Bugs triggering an unhandled exception or panic in consumer code.

### The Pipeline Head-of-Line Blocking Pathology
In an At-Least-Once ordered pipeline (such as Kafka or RabbitMQ):
1. Consumer pulls the poison-pill message.
2. Consumer panics or throws an exception.
3. Because processing failed, the consumer does NOT commit its offset and does NOT acknowledge the message.
4. The consumer restarts or retries: it immediately pulls the **exact same poison-pill message**.
5. **Head-of-Line Blocking**: The entire partition or queue freezes indefinitely, blocking millions of valid subsequent messages behind the poison pill!

### The Dead Letter Queue (DLQ) Solution
A **Dead Letter Queue (DLQ)** is a secondary, isolated quarantine queue used to divert poison-pill messages:
1. When a consumer encounters an error, it increments a **Retry Counter** in message metadata.
2. It retries processing with **Exponential Backoff and Jitter** (e.g. $1\\text{ s}, 2\\text{ s}, 4\\text{ s}$).
3. If retries exceed the **Maximum Retry Limit** ($N_{max} = 3$ to $5$):
4. The consumer writes the failed message, along with the full exception stack trace and context headers, to the **Dead Letter Queue**.
5. The consumer commits the offset on the primary queue, unblocking the pipeline for all subsequent messages.
`

- Attempt 4: Exceeded $N_{max}=3 \\implies$ **Route to DLQ immediately**.

			return nil // Success!
		}

		// Exponential backoff: 100ms, 200ms, 400ms...
		backoff := time.Duration(100*(1<<msg.RetryCount)) * time.Millisecond

	dlqErr := dlqProducer.PublishToDLQ(ctx, DLQPayload{

### The Dual-Write Problem
Modern architectures frequently require updating a relational database and publishing an event to a message broker (e.g. Kafka):
\`\`\`python
# THE DUAL-WRITE BUG:
db.commit(order)           # Step 1: Database write
kafka.publish("order_paid") # Step 2: Message broker write
\`\`\`
This naive dual-write pattern is **fundamentally broken** because it lacks distributed atomicity:
- If Step 1 succeeds, but the application crashes or network fails before Step 2: The database has the order, but Kafka never publishes the event (downstream services never ship the product!).
- If Step 2 executes first, but the database transaction rolls back: Kafka published an event for an order that does not exist!

### The Transactional Outbox Pattern
The **Transactional Outbox Pattern** solves the dual-write problem by leveraging the local ACID transaction guarantees of the relational database:
1. In the **exact same atomic database transaction** that modifies business tables, the application inserts an event record into an **\`outbox\` table**:
\`\`\`sql
BEGIN;
INSERT INTO orders (id, customer_id, total) VALUES ('ord_101', 'cust_42', 99.00);
INSERT INTO outbox_events (event_id, aggregate_type, payload) 
VALUES ('evt_501', 'ORDER', '{"order_id": "ord_101", "total": 99.00}');
COMMIT;
\`\`\`
2. Either **both** the business change and the outbox event commit to disk, or **neither** does. Atomicity is 100% guaranteed!

### Change Data Capture (CDC) Tailing
A dedicated background process (e.g. **Debezium**, Kafka Connect) tails the database's **Write-Ahead Log (WAL)** or transaction log (PostgreSQL WAL, MySQL binlog):
1. It detects new rows committed to the \`outbox_events\` table directly from disk.
2. It publishes the events to the Kafka broker.
3. Upon receiving Kafka acknowledgment, it marks the event processed or advances its WAL replication slot.

	}

### What Data Serialization Is
**Serialization** is the process of converting in-memory data structures (objects, structs) into a contiguous stream of bytes suitable for network transmission or disk storage.
**Deserialization** is the reverse: parsing the byte stream and reconstructing in-memory objects.

### The Three Serialization Generations
1. **Textual / Human-Readable (JSON, XML, YAML)**:
   - **Mechanism**: String-based key-value encoding. Every integer is converted to ASCII characters (e.g. integer \`123456\` takes 6 bytes: \`0x31 0x32 0x33 0x34 0x35 0x36\`).
   - **Cost**: Huge CPU overhead in string parsing, UTF-8 validation, and repetitive field key names (e.g. \`"customer_identifier":\`) sent millions of times over the wire.
2. **Binary with Schema (Protocol Buffers, Avro, Thrift)**:
   - **Mechanism**: Compact binary encoding using **Varints** and numerical **Field Tags** (e.g. tag \`1\` instead of \`"customer_identifier"\`).
   - **Cost**: Small wire payload ($3\\times-10\\times$ smaller than JSON), $5\\times-10\\times$ faster CPU decoding. Requires compiling \`.proto\` schema definitions.
3. **Zero-Copy Binary Layouts (FlatBuffers, Cap'n Proto)**:
   - **Mechanism**: In-memory data layout matches wire format exactly using internal pointer offsets.
   - **Cost**: **Zero parsing step**. Fields are read directly from network buffers without memory allocations or object unpacking!
`

### The Limitations of REST over HTTP/1.1
Traditional microservice architectures utilizing REST (Representational State Transfer) with JSON over HTTP/1.1 face severe physical network bottlenecks:
1. **Head-of-Line (HoL) Blocking at Application Layer**: HTTP/1.1 can only execute **one request-response exchange at a time** per TCP connection. If Request 1 is slow, Requests 2 and 3 must wait in line.
2. **Connection Bloat**: Browsers and servers open 6 to 50 parallel TCP connections to achieve concurrency, multiplying memory consumption and TLS handshake overhead.
3. **Verbose Uncompressed Headers**: Every HTTP/1.1 request transmits repetitive plain-text headers (User-Agent, Cookie, Accept) consuming $500-2000\\text{ bytes}$ per request.

gRPC is a high-performance, open-source universal RPC framework that runs exclusively over **HTTP/2**:
1. **Binary Framing Layer**: HTTP/2 breaks messages into independent binary frames (\`HEADERS\`, \`DATA\`, \`SETTINGS\`).
2. **True Request Multiplexing**: Hundreds of bidirectional gRPC streams run **concurrently over a single shared TCP connection**. Frames from different requests are interleaved on the wire and reassembled by stream ID.
3. **HPACK Header Compression**: Compresses headers using differential Huffman coding, reducing header overhead by $>85\\%$.
4. **Strong Typing with Code Generation**: Native client and server stubs generated directly in Go, Java, C++, Python, and Rust.

### What a Retry Storm Is
A **Retry Storm** is a catastrophic positive feedback loop where transient latency or error spikes in a downstream service cause upstream clients to retry requests automatically. The retries multiply total traffic, further overwhelming the downstream service and driving it into total, permanent collapse.

### The Amplification Math of Naive Retries
Suppose Service B operates at near capacity, handling $10,000\\text{ QPS}$. A temporary database lock causes $5\\%$ of requests to time out ($500\\text{ failures}$).
- Upstream Service A has naive immediate retries configured (\`retries = 3\`).
- The 500 failing requests instantly spawn $500 \\times 3 = 1,500$ additional requests!
- Service B traffic surges from $10,000\\text{ QPS}$ to $11,500\\text{ QPS}$.
- Overwhelmed by the surge, Service B's failure rate spikes to $20\\%$ ($2,300\\text{ failures}$).
- Upstream retries generate $2,300 \\times 3 = 6,900$ additional requests!
- Total traffic hits $16,900\\text{ QPS}$, CPU reaches $100\\%$, thread pools starve, and Service B experiences total collapse.

### Decorrelated Jitter: Breaking Synchronization
If 1,000 clients time out at $T=0$ and retry with fixed exponential backoff ($1\\text{ s}, 2\\text{ s}, 4\\text{ s}$), all 1,000 clients retry at **the exact same millisecond**, creating recurring **thundering herd spikes**.
To break synchronization, algorithms must apply **Decorrelated Jitter** (Amazon Architecture, Marc Brooker):
$$T_{sleep} = \\min(T_{max}, \\; \\text{rand}(T_{base}, \\; T_{previous} \\times 3))$$
Randomized backoff flattens traffic spikes into a smooth, manageable arrival distribution.
`

package main

import (
	"context"
	"math/rand"
	"time"
)

// Exponential Backoff with Full Jitter: Amazon Architecture pattern
func SleepWithJitter(ctx context.Context, attempt int, baseDelay, maxDelay time.Duration) error {
	// Calculate exponential cap: base * 2^attempt
	multiplier := 1 << attempt
	currentCap := baseDelay * time.Duration(multiplier)
	if currentCap > maxDelay || multiplier <= 0 { // Guard against integer overflow
		currentCap = maxDelay
	}

	// Full Jitter: Sleep uniformly between 0 and currentCap
	jitteredDuration := time.Duration(rand.Int63n(int64(currentCap)))

	select {
	case <-time.After(jitteredDuration):
		return nil
	case <-ctx.Done():
		return ctx.Err() // Abort if parent context was cancelled
	}
}

### What a Circuit Breaker Is (Michael Nygard, Release It!)
A **Circuit Breaker** is a resilience pattern that wraps calls to remote services in an adaptive Finite State Machine (FSM). Its primary objective is to **fail fast** when a remote dependency is unhealthy, preventing thread pool exhaustion and allowing the struggling dependency time to recover.

### The Three FSM States Step-by-Step
1. **CLOSED (Normal Operation)**:
   - Requests pass through to the remote service.
   - The breaker maintains a rolling window tracking success and failure rates.
   - If the failure rate exceeds a configurable threshold (e.g. $>50\\%$ failures over 20 requests), the breaker **trips to OPEN**.
2. **OPEN (Failing Fast)**:
   - **Zero network requests are sent to the remote service**.
   - All incoming calls fail immediately with an explicit error (e.g. \`ErrCircuitOpen\`) or execute a local fallback in $<0.1\\text{ ms}$.
   - The breaker starts a **Sleep Window** timer (e.g. $10\\text{ seconds}$) to give the remote dependency uninterrupted time to heal.
3. **HALF-OPEN (Canary Testing)**:
   - When the sleep window expires, the breaker transitions to **HALF-OPEN**.
   - A limited number of trial (canary) requests (e.g. $3$ requests) are allowed to pass through to the remote service.
   - **If all canaries succeed**: The breaker resets to **CLOSED**; normal traffic resumes.
   - **If ANY canary fails**: The breaker immediately trips back to **OPEN** for another sleep window.

			cb.lastStateChange = now
		} else {

			return ErrCircuitOpen // Fail fast!

	cb.mu.Unlock()

	// Execute protected operation
	err := fn()

	cb.mu.Lock()
	defer cb.mu.Unlock()

	if err != nil {
		cb.failureCount++
		if cb.failureCount >= cb.threshold || cb.state == StateHalfOpen {
			cb.state = StateOpen // Trip breaker
			cb.lastStateChange = time.Now()
		}
		return err
	}

	// Success
	if cb.state == StateHalfOpen {

	}

### What Rate Limiting Is
**Rate Limiting** is a traffic management mechanism that caps the number of requests a client or service can execute within a specified time window (e.g. 100 requests per minute). Requests exceeding the threshold are rejected with **HTTP 429 Too Many Requests**.

### The 4 Core Rate Limiting Algorithms
1. **Token Bucket**:
   - A bucket holds up to $B$ tokens. Refilled with tokens at a constant rate $R$ tokens/sec.
   - Each incoming request consumes 1 token. If tokens remain, request is permitted; if empty, rejected.
   - **Key Feature**: **Allows bursts of traffic up to bucket capacity $B$**, while strictly bounding long-term average throughput to $R$.
2. **Leaky Bucket**:
   - Requests enter a FIFO queue of capacity $B$. Outflow drains at a strictly constant rate $R$ requests/sec.
   - If the queue is full, incoming requests overflow and are dropped.
   - **Key Feature**: **Smooths bursts into a perfectly flat, constant outflow rate**.
3. **Fixed Window Counter**:
   - Counts requests in fixed time windows (e.g. 12:00 to 12:01).
   - **The Boundary Burst Flaw**: If a client sends 100 requests at 12:00:59 and 100 requests at 12:01:01, they successfully executed 200 requests within a 2-second window ($2\\times$ the rate limit!).
4. **Sliding Window Log**:
   - Records exact timestamps of every request in a sorted set (e.g. Redis ZSET).
   - Counts timestamps in $[T - \\text{window}, \\; T]$.
   - **Key Feature**: Completely eliminates boundary bursts, but consumes massive memory ($O(N)$ memory per client).

### What Zero Trust Architecture Is (NIST SP 800-207)
Traditional security relied on **Perimeter Defense ("Castle-and-Moat")**: once an attacker breached the external corporate firewall or VPN, the internal network was completely unencrypted and unauthenticated, allowing unrestricted lateral movement.
**Zero Trust Architecture** enforces the fundamental physical invariant:
$$\\text{\"Never Trust, Always Verify\"}$$
- **Zero implicit trust** based on network locality, physical port, or IP address.
- Every single microservice-to-microservice RPC call—even between two containers on the same physical host—must be **mutually authenticated, authorized, and end-to-end encrypted**.

### Mutual TLS (mTLS) Deep Dive
In standard TLS (one-way), only the server presents an X.509 certificate to the client.
In **Mutual TLS (mTLS)**:
1. The **Server** presents its cryptographic certificate to the client.
2. The **Client** MUST also present its own cryptographic certificate to the server!
3. Both parties cryptographically verify that the other's certificate is signed by the trusted internal **Certificate Authority (CA)**.
4. The connection establishes a shared symmetric AES-256-GCM session key for wire encryption, rendering packet sniffing and man-in-the-middle (MITM) attacks impossible.

// Base62 alphabet
const alphabet = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

func EncodeBase62(num uint64) string {
	if num == 0 {
		return string(alphabet[0])
	}
	bytes := make([]byte, 0, 7)
	for num > 0 {
		remainder := num % 62
		bytes = append(bytes, alphabet[remainder])
		num = num / 62
	}
	// Reverse bytes to big-endian
	for i, j := 0, len(bytes)-1; i < j; i, j = i+1, j-1 {
		bytes[i], bytes[j] = bytes[j], bytes[i]
	}
	return string(bytes)
}

package main

import (
	"errors"
	"sync"
	"time"
)

const (
	epoch             = int64(1767225600000) // Custom Epoch: 2026-01-01
	machineIDBits     = 10
	sequenceBits      = 12
	maxMachineID      = -1 ^ (-1 << machineIDBits) // 1023
	maxSequence       = -1 ^ (-1 << sequenceBits)  // 4095
	timeShift         = machineIDBits + sequenceBits // 22
	machineShift      = sequenceBits                // 12
)

type Snowflake struct {
	mu           sync.Mutex
	machineID    int64
	lastTimestamp int64
	sequence     int64
}

func NewSnowflake(machineID int64) (*Snowflake, error) {
	if machineID < 0 || machineID > maxMachineID {
		return nil, errors.New("machine ID out of bounds")
	}
	return &Snowflake{machineID: machineID}, nil
}

func (s *Snowflake) Generate() (int64, error) {
	s.mu.Lock()
	defer s.mu.Unlock()

	now := time.Now().UnixNano() / 1e6

	// Clock Rollback Detection
	if now < s.lastTimestamp {
		offset := s.lastTimestamp - now
		if offset <= 5 { // Short drift: sleep out the offset
			time.Sleep(time.Duration(offset) * time.Millisecond)
			now = time.Now().UnixNano() / 1e6
		} else {
			return 0, errors.New("FATAL: Clock moved backwards! Refusing to generate ID")
		}
	}

	if now == s.lastTimestamp {
		// Same millisecond: increment sequence counter
		s.sequence = (s.sequence + 1) & maxSequence
		if s.sequence == 0 {
			// Sequence exhausted (4,096 IDs in 1 ms!): spin-wait for next millisecond
			for now <= s.lastTimestamp {
				now = time.Now().UnixNano() / 1e6
			}
		}
	} else {
		s.sequence = 0
	}

	s.lastTimestamp = now

	// Assemble 64-bit integer using bit-shifts
	id := ((now - epoch) << timeShift) | (s.machineID << machineShift) | s.sequence
	return id, nil
}

### Double-Delta Timestamp Compression Invariant
Metrics are collected at regular intervals (e.g. every $10\\text{ seconds}$).
Let $t_i$ be the current timestamp and $D = t_i - t_{i-1}$ be the delta.
The **Double Delta** is:
$$D' = (t_i - t_{i-1}) - (t_{i-1} - t_{i-2}) = D_i - D_{i-1}$$
- If $D' = 0$ (perfect regular interval): Store **single bit \`0\`**!
- If $-63 \\le D' \\le 64$: Store bits \`10\` followed by 7 bits of value.
- If $-255 \\le D' \\le 256$: Store bits \`110\` followed by 9 bits.
Because 99% of metrics arrive on regular timer intervals, $D'=0$, consuming exactly 1 bit instead of 64 bits!

### XOR Floating-Point Value Compression Invariant
Consecutive metric values (e.g. CPU $42.50\\% \\to 42.51\\%$) share identical exponent and leading mantissa bits:
1. Calculate $XOR = v_i \\oplus v_{i-1}$.
2. If $XOR = 0$ (value identical to previous): Store **single bit \`0\`**.
3. If $XOR \\neq 0$: Store bit \`1\`, track leading and trailing zero bits, and store only the meaningful internal bits!

type DoubleDeltaEncoder struct {
	prevTime  int64
	prevDelta int64
	bitStream []byte
}

func (enc *DoubleDeltaEncoder) CompressTimestamp(t int64) {
	delta := t - enc.prevTime
	doubleDelta := delta - enc.prevDelta

	if doubleDelta == 0 {
		// Perfect interval: Write single bit '0'
		enc.writeBit(0)
	} else if doubleDelta >= -63 && doubleDelta <= 64 {
		// Write header '10' followed by 7 bits of value
		enc.writeBits(0x02, 2)
		enc.writeBits(uint64(doubleDelta), 7)
	} else if doubleDelta >= -255 && doubleDelta <= 256 {
		// Write header '110' followed by 9 bits
		enc.writeBits(0x06, 3)
		enc.writeBits(uint64(doubleDelta), 9)
	} else {
		// Fallback: Write header '1111' followed by full 32 bits
		enc.writeBits(0x0F, 4)
		enc.writeBits(uint64(doubleDelta), 32)
	}

	enc.prevTime = t
	enc.prevDelta = delta
}

type URLDeduplicator struct {

}

func NewURLDeduplicator(expectedURLs uint, falsePositiveRate float64) *URLDeduplicator {
	// Formula: m = -(n * ln(p)) / (ln(2)^2)

  constructor() {
    this.sections = window.SECTIONS_META || [];
    this.stages = (window.CURRICULUM_100 || []).map((s) => this.normalizeStage(s));
    this.state = this.loadState();
    this.activeStage = null;
    this.activeTab = "concept"; // "concept" | "quiz"
    this.currentQuestionIdx = 0;
    this.selectedOptionIdx = null;
    this.isAnswerSubmitted = false;
    this.correctCountInStage = 0;
    this.searchQuery = "";
    this.selectedSectionFilter = "all";
    this.toastTimer = null;

    this.init();
  }

  normalizeStage(stage) {
    if (!stage) return stage;

    const secId = stage.section || Math.ceil(stage.id / 10);
    stage.section = secId;

    const icons = ["", "🔌", "⚖️", "💾", "🗄️", "⚡", "🍩", "🗳️", "📨", "🛡️", "🏛️"];
    const sectionTitles = [
      "",
      "Phase 1: Internet, Networking & Web Protocol Foundations",
      "Phase 2: Web Architecture, Scaling & Traffic Distribution",
      "Phase 3: Hardware Invariants & Storage Engines from Scratch",
      "Phase 4: Relational Databases, Transactions & Replication",
      "Phase 5: High-Performance In-Memory Caching",
      "Phase 6: Partitioning, Sharding & Consistent Hashing",
      "Phase 7: Distributed Systems Theory, Consensus & Quorums",
      "Phase 8: Asynchronous Architecture, Event Streams & Message Brokers",
      "Phase 9: Microservices, APIs, Resilience & Security",
      "Phase 10: Senior Principal Real-World System Design Blueprints"
    ];

    stage.sectionTitle = stage.sectionTitle || stage.phase || sectionTitles[secId] || `Phase ${secId}`;
    stage.icon = stage.icon || icons[secId] || "📐";

    const companies = {
      51: "Vimeo", 52: "Discord", 53: "Cassandra", 54: "Google Bigtable", 55: "Slack",
      56: "Twitter", 57: "Elasticsearch", 58: "Stripe", 59: "Google Spanner", 60: "Uber",
      61: "GitHub", 62: "Cloudflare", 63: "Delta Airlines", 64: "Reddit", 65: "Cassandra",
      66: "GitGuardian", 67: "ZooKeeper", 68: "Cloudflare", 69: "CockroachDB", 70: "Google Spanner",
      71: "Netflix", 72: "Shopify", 73: "Deliveroo", 74: "Uber", 75: "LinkedIn",
      76: "Revolut", 77: "FinTech Ledger", 78: "Twitter", 79: "Monzo Bank", 80: "Airbnb",
      81: "Amazon", 82: "Robinhood", 83: "Google", 84: "Netflix", 85: "AWS DynamoDB",
      86: "GitHub", 87: "GitHub", 88: "Stripe", 89: "Uber", 90: "Capital One",
      91: "Bitly", 92: "Cloudflare", 93: "Discord", 94: "Discord", 95: "Prometheus",
      96: "Duolingo", 97: "Netflix", 98: "Target", 99: "Bing", 100: "Google Spanner"
    };
    stage.company = stage.company || companies[stage.id] || "Production Architecture";

    // Normalize questions / quiz
    if (!stage.questions && stage.quiz) {
      stage.questions = stage.quiz.map((q) => ({
        scenario: q.question,
        question: q.question,
        prompt: q.question,
        options: q.options,
        correctAnswer: q.answer !== undefined ? q.answer : 0,
        explanation: q.explanation
      }));
    } else if (stage.questions) {
      stage.questions = stage.questions.map((q) => ({
        ...q,
        question: q.question || q.scenario || q.prompt,
        prompt: q.prompt || q.scenario || q.question,
        scenario: q.scenario || q.question || q.prompt,
        correctAnswer: q.correctAnswer !== undefined ? q.correctAnswer : (q.answer !== undefined ? q.answer : 0)
      }));
    } else {
      stage.questions = [];
    }

    // Normalize concept if missing
    if (!stage.concept) {
      stage.concept = {
        rawLessons: stage.lessons || [],
        beginnerGlossary: [
          {
            term: stage.title.replace(/^Stage \d+:\s*/, ""),
            plainEnglish: stage.subtitle || "Fundamental distributed systems invariant.",
            whyInvented: "Engineered to eliminate single-point-of-failure bottlenecks and scale under high concurrency.",
            howItWorks: "Enforces deterministic algorithms and state transitions verified across independent distributed nodes."
          }
        ],
        architectureCard: {
          title: "Architecture & Physical Invariants",
          physicalInvariant: stage.subtitle || "Strict hardware and network boundaries.",
          mentalModel: stage.subtitle || "Core system design architecture.",
          flowSteps: ["Client Request", "Gateway Router", "Consensus Log", "Storage Engine"],
          formulaTitle: "Capacity & Invariant Bounds",
          formulaMath: "P99 Latency = f(RTT, fsync, Quorum)",
          formulaExplanation: "Physical latency is bounded by the speed of light in fiber, disk fsync duration, and network consensus round-trips."
        },
        codeCard: {
          title: "Production Implementation",
          language: "go",
          code: "// Production distributed systems implementation",
          takeaway: "Always enforce strict idempotency, timeouts, and bounded capacities in production systems."
        },
        caseStudyCard: {
          company: stage.company,
          incidentOrChallenge: "Investigating distributed failure modes and mitigating cascading outages.",
          solution: "Architected fault-tolerant state machines with circuit breakers and consensus replication.",
          keyMetric: "Achieved 99.999% availability."
        },
        simulator: {
          param1Label: "Traffic Load / QPS",
          param1Min: 10,
          param1Max: 100,
          param1Default: 50,
          param2Label: "Concurrency / Nodes",
          param2Min: 1,
          param2Max: 64,
          param2Default: 16
        }
      };
    }

    return stage;
  }

  loadState() {
    const defaults = {
      xp: 450,
      streakDays: 7,
      lastStreakClaimDate: null,
      streakFreezes: 2,
      hearts: 5,
      unlockedStage: 1,
      completedStages: [],
      unlockAllSandbox: false,
      weeklyDaysCompleted: [true, true, true, true, true, true, false]
    };

    try {
      const saved = localStorage.getItem("archlingo_100_state_v2");
      if (!saved) return defaults;

      const parsed = JSON.parse(saved);
      if (!parsed || typeof parsed !== "object") return defaults;

      return {
        xp: typeof parsed.xp === "number" ? parsed.xp : defaults.xp,
        streakDays: typeof parsed.streakDays === "number" ? parsed.streakDays : defaults.streakDays,
        lastStreakClaimDate: parsed.lastStreakClaimDate || defaults.lastStreakClaimDate,
        streakFreezes: typeof parsed.streakFreezes === "number" ? parsed.streakFreezes : defaults.streakFreezes,
        hearts: typeof parsed.hearts === "number" ? parsed.hearts : defaults.hearts,
        unlockedStage: (typeof parsed.unlockedStage === "number" && parsed.unlockedStage >= 1 && parsed.unlockedStage <= 100) ? parsed.unlockedStage : 1,
        completedStages: Array.isArray(parsed.completedStages) ? parsed.completedStages : [],
        unlockAllSandbox: Boolean(parsed.unlockAllSandbox),
        weeklyDaysCompleted: Array.isArray(parsed.weeklyDaysCompleted) && parsed.weeklyDaysCompleted.length === 7 ? parsed.weeklyDaysCompleted : defaults.weeklyDaysCompleted
      };
    } catch (e) {
      console.warn("Failed to parse saved state, using safe defaults", e);
      return defaults;
    }
  }

  saveState() {
    localStorage.setItem("archlingo_100_state_v2", JSON.stringify(this.state));
    this.updateTopNavStats();
  }

  init() {
    this.renderTopNav();
    this.renderSectionFilterBar();
    this.renderSkillPathMap();
    this.bindGlobalEvents();
  }

  updateTopNavStats() {
    const streakEl = document.getElementById("nav-streak-count");
    const xpEl = document.getElementById("nav-xp-count");
    const heartsEl = document.getElementById("nav-hearts-count");
    const progressEl = document.getElementById("nav-stage-progress");
    const totalStages = this.stages.length || 100;

    if (streakEl) streakEl.textContent = this.state.streakDays;
    if (xpEl) xpEl.textContent = this.state.xp.toLocaleString();
    if (heartsEl) heartsEl.textContent = this.state.hearts;
    if (progressEl) {
      progressEl.textContent = `${this.state.completedStages.length} / ${totalStages} Stages Completed`;
    }
  }

  renderTopNav() {
    this.updateTopNavStats();
  }

  renderSectionFilterBar() {
    const container = document.getElementById("section-jump-bar");
    if (!container) return;

    const totalStages = this.stages.length || 100;

    const sectionOptions = this.sections
      .map(
        (sec) =>
          `<option value="${sec.id}">${sec.title} (Stages ${sec.stages[0]}–${sec.stages[1]})</option>`
      )
      .join("");

    container.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 bg-white dark:bg-slate-800 p-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="flex items-center gap-2 flex-1 min-w-[240px]">
          <span class="text-lg">🧭</span>
          <select id="section-select-dropdown" class="w-full bg-slate-100 dark:bg-slate-900 font-bold text-sm rounded-xl px-3 py-2 border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-sky-500">
            <option value="all">All 10 Phases (Stages 1 – ${totalStages})</option>
            ${sectionOptions}
          </select>
        </div>

        <div class="flex items-center gap-2 flex-1 min-w-[200px]">
          <span class="text-lg">🔍</span>
          <input id="stage-search-input" type="text" placeholder="Search stages (e.g. DNS, LSM, Raft, Kafka, Cache)..."
            value="${this.searchQuery}"
            class="w-full bg-slate-100 dark:bg-slate-900 font-bold text-sm rounded-xl px-3 py-2 border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-sky-500" />
        </div>

        <div class="flex items-center gap-1.5">
          <input id="jump-stage-input" type="number" min="1" max="${totalStages}" placeholder="Stage # (1-${totalStages})"
            class="w-32 bg-slate-100 dark:bg-slate-900 font-bold text-xs rounded-xl px-2.5 py-2 border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-emerald-500" />
          <button id="btn-jump-stage" class="duo-btn-green px-3 py-1.5 text-xs">
            Go ➔
          </button>
        </div>

        <label class="flex items-center gap-2 cursor-pointer select-none bg-amber-50 dark:bg-amber-950/40 px-3 py-1.5 rounded-xl border border-amber-300 dark:border-amber-700">
          <input type="checkbox" id="toggle-sandbox-unlock" ${this.state.unlockAllSandbox ? "checked" : ""} class="rounded text-emerald-500 focus:ring-0" />
          <span class="text-xs font-extrabold text-amber-800 dark:text-amber-300">🔓 Unlock All ${totalStages} Stages</span>
        </label>
      </div>
    `;

    document.getElementById("section-select-dropdown")?.addEventListener("change", (e) => {
      this.selectedSectionFilter = e.target.value;
      this.renderSkillPathMap();
    });

    document.getElementById("stage-search-input")?.addEventListener("input", (e) => {
      this.searchQuery = e.target.value.trim().toLowerCase();
      this.renderSkillPathMap();
    });

    document.getElementById("toggle-sandbox-unlock")?.addEventListener("change", (e) => {
      this.state.unlockAllSandbox = e.target.checked;
      this.saveState();
      this.renderSkillPathMap();
    });

    const handleJumpStage = () => {
      const val = parseInt(document.getElementById("jump-stage-input")?.value, 10);
      if (!val || val < 1 || val > totalStages) {
        this.showToast(`Please enter a valid stage number between 1 and ${totalStages}!`);
        return;
      }
      this.state.unlockAllSandbox = true;
      this.saveState();
      this.openStageModal(val);
    };

    document.getElementById("btn-jump-stage")?.addEventListener("click", handleJumpStage);
    document.getElementById("jump-stage-input")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleJumpStage();
    });
  }

  renderSkillPathMap(animateHopFromStageId = null) {
    const mapContainer = document.getElementById("skill-path-container");
    if (!mapContainer) return;

    const totalStages = this.stages.length || 100;
    let filteredStages = this.stages;

    if (this.selectedSectionFilter !== "all") {
      const secId = parseInt(this.selectedSectionFilter, 10);
      filteredStages = filteredStages.filter((s) => s.section === secId);
    }

    if (this.searchQuery) {
      filteredStages = filteredStages.filter((s) => {
        const titleMatch = s.title.toLowerCase().includes(this.searchQuery);
        const companyMatch = (s.company || "").toLowerCase().includes(this.searchQuery);
        const secMatch = (s.sectionTitle || "").toLowerCase().includes(this.searchQuery);
        return titleMatch || companyMatch || secMatch;
      });
    }

    if (filteredStages.length === 0) {
      mapContainer.innerHTML = `
        <div class="duo-card p-8 text-center my-8">
          <div class="text-4xl mb-2">🔍</div>
          <div class="font-black text-lg text-slate-800 dark:text-slate-100">No Stages Found</div>
          <p class="text-xs font-bold text-slate-400 mt-1">Try searching for keywords like "DNS", "LSM", "Raft", "Kafka", or "Cache".</p>
          <button onclick="window.app.resetFilters()" class="duo-btn-blue px-4 py-2 text-xs mt-4">Reset Filters</button>
        </div>
      `;
      return;
    }

    // Group filtered stages by Phase
    const stagesBySection = {};
    filteredStages.forEach((s) => {
      if (!stagesBySection[s.section]) stagesBySection[s.section] = [];
      stagesBySection[s.section].push(s);
    });

    let html = "";
    const xOffsets = [0, 52, 95, 52, 0, -52, -95, -52];

    Object.keys(stagesBySection).forEach((secKey) => {
      const secId = parseInt(secKey, 10);
      const meta = this.sections.find((sec) => sec.id === secId) || {
        title: `Phase ${secId}`,
        badge: `Phase ${secId}`,
        color: "#58cc02"
      };

      const sectionStages = stagesBySection[secId];
      const completedInSection = sectionStages.filter((s) => this.state.completedStages.includes(s.id)).length;

      html += `
        <div class="mt-8 mb-4">
          <div class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-4 sm:p-5 rounded-3xl border-2 border-slate-700 shadow-md flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${(meta.badge || "").split(" ")[0] || "🚀"}</span>
              <div>
                <div class="text-[11px] font-black uppercase tracking-wider text-emerald-400">
                  ${meta.badge}
                </div>
                <h3 class="text-base sm:text-lg font-black text-white">
                  ${meta.title}
                </h3>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <div class="text-right">
                <div class="text-xs font-black text-slate-300">
                  ${completedInSection} / ${sectionStages.length} Done
                </div>
                <div class="w-28 h-2.5 bg-slate-700 rounded-full overflow-hidden mt-1">
                  <div class="h-full bg-emerald-500 rounded-full transition-all" style="width: ${Math.round((completedInSection / sectionStages.length) * 100)}%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="flex flex-col items-center py-4 space-y-6">
      `;

      sectionStages.forEach((stage) => {
        const offsetIdx = (stage.id - 1) % xOffsets.length;
        const xTranslate = xOffsets[offsetIdx];

        const isCompleted = this.state.completedStages.includes(stage.id);
        const isCurrent = stage.id === this.state.unlockedStage;
        const isUnlocked = this.state.unlockAllSandbox || isCompleted || stage.id <= this.state.unlockedStage;

        let nodeClass = "stone-locked";
        if (isCompleted) {
          nodeClass = "stone-complete";
        } else if (isCurrent || (isUnlocked && !isCompleted)) {
          nodeClass = "stone-current";
        }

        const isArchieHere = isCurrent && !isCompleted;
        const animateHop = animateHopFromStageId === stage.id;

        html += `
          <div class="flex flex-col items-center relative transition-transform duration-300" style="transform: translateX(${xTranslate}px)">
            ${
              isArchieHere
                ? `
              <div class="absolute -top-14 z-20 flex flex-col items-center pointer-events-none ${animateHop ? "animate-archie-hop" : ""}">
                <div class="bg-emerald-500 text-white font-black text-[11px] px-2.5 py-1 rounded-xl shadow-lg border-2 border-emerald-400 speech-bubble whitespace-nowrap">
                  Start Stage ${stage.id}!
                </div>
                <div class="text-3xl -mt-1 select-none">🦉</div>
              </div>
            `
                : ""
            }

            <button
              id="stage-node-${stage.id}"
              onclick="window.app.openStageModal(${stage.id})"
              class="stone-node ${nodeClass}"
              title="Stage ${stage.id}: ${stage.title} (${stage.company})"
            >
              <span class="text-2xl">${isUnlocked ? stage.icon : "🔒"}</span>
              ${
                isCompleted
                  ? `<span class="absolute -top-1.5 -right-1.5 bg-amber-400 text-amber-950 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow">★</span>`
                  : ""
              }
            </button>

            <div class="mt-1.5 text-center max-w-[200px]">
              <div class="text-xs font-black text-slate-700 dark:text-slate-200 leading-tight">
                Stage ${stage.id}: ${stage.title}
              </div>
              <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">
                ${stage.company} Case Study
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
    });

    mapContainer.innerHTML = html;

    if (animateHopFromStageId) {
      const targetEl = document.getElementById(`stage-node-${this.state.unlockedStage}`);
      if (targetEl) {
        setTimeout(() => {
          targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 120);
      }
    }
  }

  resetFilters() {
    this.searchQuery = "";
    this.selectedSectionFilter = "all";
    this.renderSectionFilterBar();
    this.renderSkillPathMap();
  }

  openStageModal(stageId) {
    const stage = this.stages.find((s) => s.id === stageId);
    if (!stage) return;

    const totalStages = this.stages.length || 100;
    const isUnlocked =
      this.state.unlockAllSandbox ||
      this.state.completedStages.includes(stageId) ||
      stageId <= this.state.unlockedStage;

    if (!isUnlocked) {
      this.showToast(`🔒 Complete Stage ${this.state.unlockedStage} first, or toggle "Unlock All ${totalStages} Stages" in the filter bar!`);
      return;
    }

    this.activeStage = stage;
    this.activeTab = "concept";
    this.currentQuestionIdx = 0;
    this.selectedOptionIdx = null;
    this.isAnswerSubmitted = false;
    this.correctCountInStage = 0;

    this.renderStageLessonModal();
    const modal = document.getElementById("stage-lesson-modal");
    if (modal) modal.classList.remove("hidden");
  }

  closeStageModal() {
    const modal = document.getElementById("stage-lesson-modal");
    if (modal) modal.classList.add("hidden");
    this.activeStage = null;
  }

  switchLessonTab(tabName) {
    this.activeTab = tabName;
    this.renderStageLessonModal();
  }

  renderMarkdown(text) {
    if (!text) return "";
    let html = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // Code blocks with syntax formatting
    html = html.replace(/```([a-z0-9_+-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      return `<div class="my-3 rounded-2xl overflow-hidden border-2 border-slate-700 bg-slate-900 shadow-md">
        <div class="bg-slate-800 px-4 py-1.5 text-[11px] font-black uppercase text-emerald-400 border-b border-slate-700 flex justify-between items-center">
          <span>💻 ${lang || "code"}</span>
          <span class="text-slate-400 text-[10px]">PRODUCTION IMPLEMENTATION</span>
        </div>
        <pre class="p-4 text-xs sm:text-sm font-mono leading-relaxed overflow-x-auto text-emerald-200"><code>${code.trim()}</code></pre>
      </div>`;
    });

    // Math display blocks: $$ ... $$
    html = html.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
      return `<div class="my-3 bg-slate-900 text-emerald-400 font-mono text-center p-3 rounded-2xl border-2 border-slate-700 text-sm sm:text-base overflow-x-auto shadow-inner">
        ${formula.trim()}
      </div>`;
    });

    // Inline math: $ ... $
    html = html.replace(/\$([^\$\n]+)\$/g, '<code class="bg-slate-100 dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 px-1.5 py-0.5 rounded-md font-mono text-xs border border-emerald-500/20">$1</code>');

    // Inline code: ` ... `
    html = html.replace(/`([^`\n]+)`/g, '<code class="bg-slate-100 dark:bg-slate-900 text-sky-600 dark:text-sky-400 px-1.5 py-0.5 rounded-md font-mono text-xs border border-slate-300 dark:border-slate-700">$1</code>');

    // Headers
    html = html.replace(/^### (.*$)/gim, '<h4 class="font-black text-sm text-slate-900 dark:text-white mt-4 mb-2 flex items-center gap-2"><span class="text-emerald-500">▶</span> $1</h4>');
    html = html.replace(/^## (.*$)/gim, '<h3 class="font-black text-base text-slate-900 dark:text-white mt-5 mb-2 pb-1 border-b border-slate-200 dark:border-slate-700">$1</h3>');

    // Bold & italic
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="font-black text-slate-900 dark:text-white">$1</strong>');
    html = html.replace(/\*(.*?)\*/g, '<em class="italic">$1</em>');

    // Lists
    html = html.replace(/^\s*-\s+(.*$)/gim, '<li class="text-xs font-bold text-slate-700 dark:text-slate-300 ml-4 list-disc my-1">$1</li>');

    // Tables
    html = html.replace(/\|(.+)\|/g, (match) => {
      if (match.includes("---")) return "";
      const cells = match.split("|").filter((c) => c.trim().length > 0);
      const cellHtml = cells.map((c) => `<td class="p-2.5 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300">${c.trim()}</td>`).join("");
      return `<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50">${cellHtml}</tr>`;
    });

    html = html.replace(/(<tr[\s\S]*?<\/tr>)+/g, (match) => {
      return `<div class="my-4 overflow-x-auto rounded-2xl border-2 border-slate-200 dark:border-slate-700 shadow-sm">
        <table class="w-full text-left border-collapse bg-white dark:bg-slate-800">${match}</table>
      </div>`;
    });

    html = html.replace(/\n\n+/g, '<div class="my-2"></div>');

    return html;
  }

  renderStageLessonModal() {
    const stage = this.activeStage;
    if (!stage) return;

    const modalContent = document.getElementById("stage-lesson-content");
    if (!modalContent) return;

    const totalStages = this.stages.length || 100;
    const isConceptTab = this.activeTab === "concept";

    modalContent.innerHTML = `
      <!-- Lesson Modal Header -->
      <div class="flex flex-wrap items-center justify-between gap-3 pb-4 border-b-2 border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-3">
          <span class="text-3xl">${stage.icon}</span>
          <div>
            <div class="text-xs font-black uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
              STAGE ${stage.id} OF ${totalStages} • ${stage.sectionTitle}
            </div>
            <h2 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white">
              ${stage.title}
            </h2>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Tab Switcher Pills -->
          <div class="bg-slate-100 dark:bg-slate-900 p-1 rounded-xl flex items-center gap-1 border border-slate-200 dark:border-slate-700">
            <button
              onclick="window.app.switchLessonTab('concept')"
              class="px-3.5 py-1.5 rounded-lg text-xs font-black transition ${
                isConceptTab
                  ? "bg-emerald-500 text-white shadow"
                  : "text-slate-600 dark:text-slate-300 hover:text-slate-900"

  bindSimulatorSliders(stage) {
    const s1 = document.getElementById("sim-slider-1");
    const s2 = document.getElementById("sim-slider-2");
    const v1 = document.getElementById("sim-val-1");
    const v2 = document.getElementById("sim-val-2");
    const outLat = document.getElementById("sim-out-latency");
    const outThr = document.getElementById("sim-out-throughput");
    const outSla = document.getElementById("sim-out-sla");

    const updateMetrics = () => {
      if (!s1 || !s2) return;
      const val1 = Number(s1.value);
      const val2 = Number(s2.value);
      if (v1) v1.textContent = val1;
      if (v2) v2.textContent = val2;

      // Realistic queueing delay & SLA model
      let latencyMs = (5 + val1 * 0.1 + val2 * 0.05).toFixed(1);
      let throughputVal = Math.round(val1 * Math.max(1, val2) * 1.2);
      let slaStr = "99.999%";

      if (stage.id <= 10) {
        latencyMs = (val1 * 0.4 + (1500 / Math.max(64, val2)) * 1.5).toFixed(1);
        throughputVal = Math.round(((val1 * 1000) / Math.max(64, val2)) * 8);
        slaStr = val1 > 80 ? "99.95%" : "99.999%";
      } else if (stage.id <= 30) {
        latencyMs = Math.max(0.2, val1 * 0.02 + val2 * 0.1).toFixed(2);
        throughputVal = Math.round(50000 / (1 + val1 * 0.05));
        slaStr = val1 > 80 ? "99.90%" : "99.999%";
      } else {
        const loadFactor = val1 / (val2 * 500);
        if (loadFactor > 0.85) {
          latencyMs = (15 / (1 - Math.min(0.98, loadFactor))).toFixed(1);
          slaStr = loadFactor > 0.95 ? "99.50%" : "99.90%";
        } else {
          latencyMs = (8 + loadFactor * 12).toFixed(1);
          slaStr = "99.999%";
        }
      }

      if (outLat) outLat.textContent = `${latencyMs} ms`;
      if (outThr) outThr.textContent = `${throughputVal.toLocaleString()} QPS`;
      if (outSla) outSla.textContent = slaStr;
    };

    s1?.addEventListener("input", updateMetrics);
    s2?.addEventListener("input", updateMetrics);
    updateMetrics();
  }
